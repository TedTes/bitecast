[project]
name = "bitecast-ml"
version = "0.1.0"
description = "Training, evaluation, registry, and batch inference for the BiteCast walleye model"
requires-python = ">=3.11"
dependencies = [
  "astral>=3.2",
  "catboost>=1.2.8",
  "httpx>=0.27",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=17",
  "pydantic>=2.9",
  "scikit-learn>=1.5",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[project.scripts]
bitecast-ml = "bitecast_ml.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bitecast_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
